<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06100f">
  <title>OnePath.Image — Desktop concept</title>
  <link rel="preload" href="assets/doto-variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="assets/ui.css">
  <script defer src="assets/ui.js"></script>
</head>
<body>
  <div class="scene-effects" id="sceneEffects" aria-hidden="true">
    <div class="wallpaper-fill"></div>
    <div class="wallpaper-full"></div>
    <div class="sky-wash"></div>
    <canvas id="stars"></canvas>
    <canvas id="rain"></canvas>
    <div class="grain"></div>
    <div class="crt-overlay"></div>
  </div>

  <div id="uiLayer">
  <header class="top" id="topBar">
    <div class="brand"><span class="brand-mark"></span>ONEPATH.IMAGE</div>
    <div class="top-right"><span class="local-dot"></span><span>LOCAL PREVIEW</span><span class="top-divider"></span><span id="clock">--:--</span></div>
  </header>
  <button class="header-toggle" id="headerToggle" aria-label="Hide header" aria-expanded="true" title="Hide header">⌃</button>

  <main class="center" aria-label="Daily dashboard">
    <div class="clock-face"><div class="time" id="time" aria-live="off"><span id="timeHours">--</span><span class="time-separator" aria-hidden="true"><i></i><i></i></span><span id="timeMinutes">--</span></div><button class="clock-format" id="clockFormat" aria-label="Switch to 12-hour clock" title="Switch to 12-hour clock">24H</button></div>
    <section class="message-slot" id="messageSlot" aria-live="polite" aria-atomic="true">
      <p class="message-kicker" id="messageKicker">A MOMENT FOR YOU</p>
      <p class="message-text" id="messageText">Good evening.</p>
      <p class="message-credit" id="messageCredit"></p>
    </section>
    <div class="center-actions">
      <button class="focus-button" id="focusButton"><span class="focus-orb" aria-hidden="true">◉</span><span id="focusText">Start focusing</span></button>
      <button class="message-next" id="messageNext" aria-label="Show next message" title="Next message">↻</button>
    </div>
    <p class="focus-timer" id="focusTimer" hidden></p>
  </main>

  <section class="agent-panel" id="agentPanel" aria-label="Choose an agent">
    <p class="panel-label">YOUR AGENTS</p>
    <button class="agent agent-boss active" data-agent="Gandalf" aria-pressed="true">
      <span class="agent-glyph" aria-hidden="true">✦</span>
      <span class="agent-copy"><strong>Gandalf</strong><small>Orchestrator <i>·</i> Cloud only</small></span>
      <span class="agent-state" aria-hidden="true"></span>
    </button>
    <button class="agent" data-agent="Hermes" aria-pressed="false"><span class="agent-glyph" aria-hidden="true">☿</span><span class="agent-copy"><strong>Hermes</strong><small>Research</small></span><span class="agent-state" aria-hidden="true"></span></button>
    <button class="agent" data-agent="Atomic" aria-pressed="false"><span class="agent-glyph" aria-hidden="true">⚛</span><span class="agent-copy"><strong>Atomic</strong><small>Workflows</small></span><span class="agent-state" aria-hidden="true"></span></button>
    <button class="agent" data-agent="DeepSeek" aria-pressed="false"><span class="agent-glyph" aria-hidden="true">≈</span><span class="agent-copy"><strong>DeepSeek</strong><small>Code</small></span><span class="agent-state" aria-hidden="true"></span></button>
  </section>

  <figure class="sky-motif" id="skyMotif" aria-label="Gandalf wizard constellation"></figure>

  <section class="appearance-panel" id="themePanel" aria-label="Appearance controls" hidden>
    <div class="panel-heading"><p class="panel-label">APPEARANCE</p><button class="panel-close" data-close="themePanel" aria-label="Close appearance controls">×</button></div>
    <div class="swatches" role="group" aria-label="Color theme">
      <button class="swatch selected" data-theme="mint" aria-pressed="true"><i style="--swatch:#63ffc1"></i>Mint</button>
      <button class="swatch" data-theme="amber" aria-pressed="false"><i class="hot-metal" style="--swatch:#ff6a1a"></i>Hot metal</button>
      <button class="swatch" data-theme="ice" aria-pressed="false"><i style="--swatch:#edf8ff"></i>Ice</button>
      <button class="swatch" data-theme="matrix" aria-pressed="false"><i style="--swatch:#00ff6a"></i>Matrix</button>
    </div>
    <label class="scale-control" for="scaleSlider"><span>Interface scale <output id="scaleValue">100%</output></span><input id="scaleSlider" type="range" min="80" max="120" value="100" aria-label="Interface scale"></label>
    <div class="display-options"><button id="clockFormatSetting" aria-pressed="false" title="Switch between 12 and 24 hour time">24H clock</button><button id="crtToggle" aria-pressed="false">▤ CRT off</button><button id="motionToggle" aria-pressed="false">◌ <span id="motionText">Motion on</span></button></div>
  </section>

  <div class="controls-wrap" id="controlsWrap">
    <button class="controls-toggle" id="controlsToggle" aria-label="Open controls" aria-expanded="false" aria-controls="controlsMenu" title="Controls"><span class="control-glyph" aria-hidden="true">☰</span><span class="controls-label">CONTROLS</span></button>
    <nav class="controls-menu" id="controlsMenu" aria-label="Workspace controls" hidden>
      <p class="menu-heading">WORKSPACE</p>
      <button class="menu-item" data-action="command"><span class="menu-icon">⌘</span><span><strong>Command</strong><small>Preview only · not connected</small></span><span class="menu-tail">↗</span></button>
      <button class="menu-item" data-action="agents" aria-controls="agentPanel"><span class="menu-icon">✦</span><span><strong>Agents</strong><small>Choose an agent</small></span><span class="menu-tail">⌄</span></button>
      <button class="menu-item" data-action="appearance" aria-controls="themePanel"><span class="menu-icon">◇</span><span><strong>Appearance</strong><small>Theme and motion</small></span><span class="menu-tail">⌄</span></button>
      <button class="menu-item" data-action="files"><span class="menu-icon">▤</span><span><strong>Files</strong><small>Preview only · not connected</small></span><span class="menu-tail">↗</span></button>
      <label class="name-setting" for="displayName"><span>Greeting name <small>Optional</small></span><input id="displayName" type="text" maxlength="32" autocomplete="name" placeholder="Add your name"></label>
      <p class="prototype-note">Gandalf is a cloud-only prototype. No cloud connection is active.</p>
    </nav>
  </div>

  <div class="navi-launcher" id="naviLauncher">
    <button class="navi-trigger" id="naviTrigger" aria-label="Open NAVI product shortcuts" aria-expanded="false" aria-controls="naviMenu" title="NAVI">
      <svg class="navi-sprite" viewBox="0 0 64 80" role="img" aria-label="Mint pixel outline cat">
        <g class="cat-outline" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter">
          <path d="M11 32V12h7V7h7v5h14V7h7v5h7v20H46v5H18v-5z"/>
          <path d="M19 21h3m17 0h3M27 27h8"/>
          <path d="M18 39h28M22 39v10l-6 5m26-15v10l6 5M16 54v7h-5m36-7v7h6M32 39v11"/>
          <path d="M16 40l-7 4-3-4M46 40l6 5"/>
        </g>
        <g class="navi-pose" id="naviPose" aria-hidden="true"></g>
      </svg>
      <span class="navi-glow" aria-hidden="true"></span><span class="navi-label">NAVI</span>
    </button>
    <div class="navi-menu" id="naviMenu" role="menu" aria-label="NAVI product shortcuts" hidden>
      <p class="menu-heading">LINKED WORKSPACES</p>
      <a class="navi-link" role="menuitem" href="http://127.0.0.1:5050/" target="_blank" rel="noopener noreferrer"><span class="menu-icon">〈/〉</span><span><strong>DevHub.Studio</strong><small>Development workspace</small></span><span class="menu-tail">↗</span></a>
      <a class="navi-link" role="menuitem" href="http://127.0.0.1:8501/" target="_blank" rel="noopener noreferrer"><span class="menu-icon">»</span><span><strong>NextPath.City</strong><small>Research and career guide</small></span><span class="menu-tail">↗</span></a>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
