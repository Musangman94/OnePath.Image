<script>
(()=>{const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],root=document.documentElement,agentPanel=$('#agentPanel'),themePanel=$('#themePanel'),status=$('#status'),statusSub=$('#statusSub');
const saved=JSON.parse(localStorage.getItem('onepathConcept')||'{}');let uiScale=Math.max(.8,Math.min(1.2,Number(saved.scale)||1));root.style.setProperty('--ui-scale',uiScale);$('#scaleSlider').value=Math.round(uiScale*100);$('#scaleValue').value=Math.round(uiScale*100)+'%';if(saved.crt!==false)root.classList.add('crt-enabled');if(saved.crt===false){$('#crtToggle').setAttribute('aria-pressed','false');$('#crtToggle').textContent='▤ CRT off'}if(saved.theme){const savedTheme=saved.theme==='violet'?'matrix':saved.theme;root.dataset.theme=savedTheme;$$('.swatch').forEach(b=>b.classList.toggle('selected',b.dataset.theme===savedTheme))}if(saved.motion===false){root.classList.add('no-motion');$('#motionToggle').setAttribute('aria-pressed','true');$('#motionText').textContent='Motion off'}
const persist=()=>localStorage.setItem('onepathConcept',JSON.stringify({theme:root.dataset.theme,motion:!root.classList.contains('no-motion'),crt:root.classList.contains('crt-enabled'),scale:uiScale}));$('#crtToggle').onclick=()=>{root.classList.toggle('crt-enabled');const on=root.classList.contains('crt-enabled');$('#crtToggle').setAttribute('aria-pressed',String(on));$('#crtToggle').textContent=on?'▤ CRT on':'▤ CRT off';persist()};$$('.swatch').forEach(b=>b.addEventListener('click',()=>{root.dataset.theme=b.dataset.theme;$$('.swatch').forEach(x=>x.classList.toggle('selected',x===b));persist()}));
const toast=(s)=>{const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)};
$('#hideAgents').onclick=()=>{agentPanel.classList.add('minimized');toast('Agent picker hidden · press A to show')};$('#hideTheme').onclick=()=>{themePanel.classList.add('minimized');toast('Appearance hidden · press T to show')};$('#appearanceToggle').onclick=()=>themePanel.classList.toggle('minimized');$('#dockTheme').onclick=()=>themePanel.classList.toggle('minimized');$('#dockAgents').onclick=()=>agentPanel.classList.toggle('minimized');
$$('.agent').forEach(b=>b.onclick=()=>{$$('.agent').forEach(x=>x.classList.toggle('active',x===b));toast(`${b.dataset.agent} · ${b.dataset.role} selected`)});
$('#motionToggle').onclick=()=>{root.classList.toggle('no-motion');const off=root.classList.contains('no-motion');$('#motionToggle').setAttribute('aria-pressed',String(off));$('#motionText').textContent=off?'Motion off':'Motion on';persist()};

const naviTrigger=$('#naviTrigger'),naviMenu=$('#naviMenu');const setNaviOpen=open=>{naviMenu.classList.toggle('open',open);naviTrigger.setAttribute('aria-expanded',String(open))};naviTrigger.onclick=()=>setNaviOpen(naviTrigger.getAttribute('aria-expanded')!=='true');document.addEventListener('click',e=>{if(!e.target.closest('#naviLauncher'))setNaviOpen(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){agentPanel.classList.add('minimized');themePanel.classList.add('minimized');setNaviOpen(false)}if(e.key.toLowerCase()==='a'&&document.activeElement.tagName!=='INPUT')agentPanel.classList.toggle('minimized');if(e.key.toLowerCase()==='t'&&document.activeElement.tagName!=='INPUT')themePanel.classList.toggle('minimized');if(e.key.toLowerCase()==='h'&&document.activeElement.tagName!=='INPUT')toggleHeader()});
const tick=()=>{const d=new Date();$('#clock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});$('#time').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});const h=d.getHours();$('#greeting').textContent=h>=5&&h<12?'Good morning.':h>=12&&h<17?'Good afternoon.':h>=17&&h<24?'Good evening.':'Good night.'};tick();setInterval(tick,1000);
const quotes=['Make space for the work that matters.','Small steps still move you forward.','Focus on what you can change.','Start where you are; use what you have.','Quiet progress is still progress.','Attention is your most valuable resource.'];const dayIndex=Math.floor(Date.now()/86400000);let quoteIndex=dayIndex%quotes.length;const paintQuote=()=>$('#dailyQuote').textContent='“'+quotes[quoteIndex]+'”';paintQuote();$('#quoteButton').onclick=()=>{quoteIndex=(quoteIndex+1)%quotes.length;paintQuote()};
let focusTimer=null,focusSeconds=25*60;$('#focusButton').onclick=()=>{if(focusTimer){clearInterval(focusTimer);focusTimer=null;focusSeconds=25*60;$('#focusButton').innerHTML='◉ <span>Start Focusing</span>';return}$('#focusButton').innerHTML='Ⅱ <span>25:00 · Pause</span>';focusTimer=setInterval(()=>{focusSeconds--;if(focusSeconds<=0){clearInterval(focusTimer);focusTimer=null;$('#focusButton').innerHTML='✓ <span>Session complete</span>';return}const m=String(Math.floor(focusSeconds/60)).padStart(2,'0'),sec=String(focusSeconds%60).padStart(2,'0');$('#focusButton').innerHTML='Ⅱ <span>'+m+':'+sec+' · Pause</span>'},1000)};
$('#scaleSlider').oninput=e=>{uiScale=Number(e.target.value)/100;root.style.setProperty('--ui-scale',uiScale);$('#scaleValue').value=e.target.value+'%';persist()};
const toggleHeader=()=>{const hidden=$('.top').classList.toggle('header-hidden');$('#headerToggle').setAttribute('aria-label',hidden?'Show top bar':'Hide top bar');toast(hidden?'Top bar hidden · press H to show':'Top bar shown')};$('#headerToggle').onclick=toggleHeader;$('#dockHeader').onclick=toggleHeader;
// HTML Canvas digital rain: persistent glyph columns inspired by terminal matrix effects.
const canvas=$('#rain'),ctx=canvas.getContext('2d',{alpha:true});let w=0,h=0,cols=[],raf,last=0,dpr=1,staticDirty=true;const chars='ｦｱｳｴｵｶｷｸｹｺｻｼｽｿﾀﾂﾃﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾔﾕﾗﾘﾜ012345789ABCDEFGHIJKLMNOPQRSTUVWXYZ';const pick=()=>chars[(Math.random()*chars.length)|0];function makeGlyphs(n){return Array.from({length:n},()=>({ch:pick(),mutate:Math.random()*900}))}function resize(){dpr=Math.min(window.devicePixelRatio||1,2);w=window.innerWidth;h=window.innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);const step=Math.max(28,Math.min(34,Math.round(w/75)));const count=Math.ceil(w/step);cols=Array.from({length:count},(_,i)=>{const len=8+(Math.random()*20|0),gap=step*1.2;return{x:i*step+step/2,y:Math.random()*h,speed:90+Math.random()*190,len,gap,mutate:Math.random()*84,glyphs:makeGlyphs(len)}});staticDirty=true}function draw(now){raf=requestAnimationFrame(draw);const paused=root.classList.contains('no-motion');if(document.hidden){last=now;return}if(paused&&!staticDirty){last=now;return}const dt=paused?0:Math.min((now-last)/1000||0,.04);last=now;ctx.clearRect(0,0,w,h);ctx.textAlign='center';ctx.textBaseline='middle';for(const c of cols){if(!paused){c.y+=c.speed*dt;c.mutate-=dt*1000;if(c.mutate<=0){const index=Math.random()*c.len|0;c.glyphs[index].ch=pick();c.mutate=(80+Math.random()*200)/3}}ctx.font='italic 15px "Doto","MS Gothic","Cascadia Mono",Consolas,monospace';for(let j=0;j<c.len;j++){const y=c.y-j*c.gap;if(y<-18||y>h+18)continue;const fade=1-j/c.len;ctx.globalAlpha=j===0?.98:Math.max(.08,.75*fade);ctx.fillStyle=j===0?'#eafff3':j===1?'#8dffaf':'#00e85b';ctx.shadowColor=j===0?'#eafff3':'#00ff66';ctx.shadowBlur=j===0?18:7;ctx.fillText(c.glyphs[j].ch,c.x,y)}if(!paused&&c.y-c.len*c.gap>h){c.y=-Math.random()*h*.7;c.speed=90+Math.random()*190;c.len=8+(Math.random()*20|0);c.glyphs=makeGlyphs(c.len)}}ctx.globalAlpha=1;ctx.shadowBlur=0;staticDirty=false}resize();raf=requestAnimationFrame(draw);addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(!document.hidden){last=performance.now();}});addEventListener('pagehide',()=>cancelAnimationFrame(raf));})();
</script></body></html>
